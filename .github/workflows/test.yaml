on:
    # trigger the workflow on any pull request against the default branch (main)
    pull_request:
        types: [opened, reopened, synchronize]
        branches: [ main ]
    push:

#mod
jobs:
    run-tests:
        name: "Run the tests!"
        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash

        steps:
            -   name: get event info
                run: echo "${{ toJson(github) }}"

            -   if: ${{ github.event.pull_request || github.event.head_commit }}
                name: checkout (PR)
                uses: actions/checkout@v4

            -   if: ${{ github.event.head_commit }}
                name: commit info
                run: echo '${{ toJson(github.event.head_commit) }}'

            -   if: ${{ github.event.head_commit }}
                name: push commit message
                run: |
                    echo "Commit Message: ${{github.event.head_commit.message}}"
                    echo "Commit Hash: ${__commit_hash:0:7}"
                    echo "Short Commit Hash: ${__short_commit_hash}"
                env:
                    __commit_hash: ${{ github.event.head_commit.id }}
                    __short_commit_hash: ${__commit_hash:0:7}

            -   name: commit message contains expected message?
                run: echo 'contains [FORCE buildAndPush]? ' ${{ contains(github.event.head_commit.message, '[FORCE buildAndPush]') }}

            -   name: checkout (push @ ${{github.sha}})
                uses: actions/checkout@v4

            -   name: output github context
                run: echo "${{ github }}"
            - uses: ./.github/actions/run-setup/
            - uses: ./.github/actions/run-tests/
